name: Lean audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lean toolchain and Lake dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the public Lean root
        run: lake build

      - name: Audit the conditional Chen chain
        run: |
          set -euo pipefail
          lake env lean Audit.lean | tee audit.log
          # `grep` is part of the Ubuntu runner base image; do not rely on
          # ripgrep being preinstalled merely to run this trust guard.
          if grep -n -- 'sorryAx' audit.log; then
            echo 'The audited conditional Chen chain depends on sorryAx.' >&2
            exit 1
          fi

      - name: Guard the explicit obligation inventory
        run: |
          set -euo pipefail
          count="$(grep -R -n --include='*.lean' -E '^[[:space:]]*sorry[[:space:]]*$' MathlibNt | wc -l | tr -d ' ')"
          echo "executable_sorry_count=$count"
          test "$count" -eq 1
