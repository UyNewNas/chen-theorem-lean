name: Lean audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lean toolchain and Lake dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the public Lean root
        run: lake build

      - name: Audit the conditional Chen chain
        run: |
          set -euo pipefail
          lake env lean Audit.lean | tee audit.log
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          output = pathlib.Path('audit.log').read_text(encoding='utf-8')
          reports = re.findall(r'depends on axioms:\s*\[(.*?)\]', output, re.S)
          expected_reports = 61
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          if len(reports) != expected_reports:
              print(f'Expected {expected_reports} axiom reports, found {len(reports)}.', file=sys.stderr)
              sys.exit(1)
          used = {
              axiom.strip()
              for report in reports
              for axiom in report.split(',')
              if axiom.strip()
          }
          unexpected = used - allowed
          if unexpected:
              print('Non-whitelisted axioms: ' + ', '.join(sorted(unexpected)), file=sys.stderr)
              sys.exit(1)
          print('Axiom whitelist passed: ' + ', '.join(sorted(used)))
          PY

      - name: Guard the zero-placeholder invariant
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          paths = subprocess.check_output(['git', 'ls-files', '-z', '--', '*.lean']).decode().split('\0')
          token = re.compile(r'\b(?:sorry|admit)\b')

          def executable_text(source):
              out, i, depth, string = [], 0, 0, False
              while i < len(source):
                  if depth:
                      if source.startswith('/-', i): depth += 1; out.extend('  '); i += 2
                      elif source.startswith('-/', i): depth -= 1; out.extend('  '); i += 2
                      else: out.append('\n' if source[i] == '\n' else ' '); i += 1
                  elif string:
                      if source[i] == '\\' and i + 1 < len(source): out.extend('  '); i += 2
                      elif source[i] == '"': string = False; out.append(' '); i += 1
                      else: out.append('\n' if source[i] == '\n' else ' '); i += 1
                  elif source.startswith('--', i):
                      end = source.find('\n', i)
                      if end < 0: out.extend(' ' * (len(source) - i)); break
                      out.extend(' ' * (end - i)); i = end
                  elif source.startswith('/-', i): depth = 1; out.extend('  '); i += 2
                  elif source[i] == '"': string = True; out.append(' '); i += 1
                  else: out.append(source[i]); i += 1
              return ''.join(out)

          failures = []
          for name in filter(None, paths):
              code = executable_text(pathlib.Path(name).read_text(encoding='utf-8'))
              for match in token.finditer(code):
                  failures.append(f'{name}:{code.count(chr(10), 0, match.start()) + 1}: {match.group(0)}')
          if failures:
              print('\n'.join(failures), file=sys.stderr)
              sys.exit(1)
          print('Tracked Lean sources contain no executable sorry/admit terms.')
          PY
