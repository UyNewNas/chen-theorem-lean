name = "mathlib_nt"
version = "0.1.0"
keywords = ["math", "number-theory"]
defaultTargets = ["MathlibNt"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "e4c91783ca8e6a7c693ae624ade32fd22d4e43c1"

[[require]]
name = "analytic_number_theory"
git = "https://github.com/UyNewNas/analytic-number-theory-lean.git"
rev = "8a864d9eb5a9779e744c52f1f014161b1318e21f"

# `MathlibNt.lean` is the audited public root: building it recursively checks
# the entire module set shipped by this focused repository.
[[lean_lib]]
name = "MathlibNt"
globs = [
  "MathlibNt"
]
